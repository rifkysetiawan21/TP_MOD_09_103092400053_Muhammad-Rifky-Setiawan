<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 16px;
        }
        
        .card {
            max-width: 440px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        
        h1 {
            font-size: 20px;
            margin: 0 0 20px;
        }
        
        label.judul {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        
        input[type="text"],
        input[type="date"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        
        .hobi label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .hobi {
            margin-bottom: 16px;
        }
        
        button {
            background: #007bff;
            color: #fff;
            border: none;
            padding: 9px 18px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0069d9;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Formulir Data Diri</h1>
        <form action="proses_data_diri.php" method="POST">
            <label class="judul" for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>

            <label class="judul" for="tanggal_lahir">Tanggal Lahir:</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>

            <div class="hobi">
                <label class="judul">Hobi:</label>
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>

            <button type="submit">Kirim</button>
        </form>
    </div>
</body>

</html>
